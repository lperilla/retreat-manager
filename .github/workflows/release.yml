name: Release

# Builds the desktop installers and publishes them when a v* tag is pushed:
#   - Windows .exe on a native Windows runner (NSIS needs no Wine there)
#   - Linux .deb and .AppImage on Ubuntu, with the same Docker script used locally
on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual run: builds and uploads the artifacts, does not publish

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/RetreatManager-Setup-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-desktop.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/retreat-manager_*_amd64.deb
            dist/RetreatManager-*-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.value }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.version.outputs.value }}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the artifacts and write checksums
        working-directory: dist
        run: |
          v='${{ steps.version.outputs.value }}'
          files=("RetreatManager-Setup-$v.exe" "retreat-manager_${v}_amd64.deb" "RetreatManager-$v-x86_64.AppImage")
          for f in "${files[@]}"; do test -f "$f" || { echo "Missing $f" >&2; exit 1; }; done
          sha256sum "${files[@]}" | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RetreatManager-Setup-${{ steps.version.outputs.value }}.exe
            dist/retreat-manager_${{ steps.version.outputs.value }}_amd64.deb
            dist/RetreatManager-${{ steps.version.outputs.value }}-x86_64.AppImage
            dist/SHA256SUMS
          generate_release_notes: true
