name: CI

# Validates every pull request (and main): clean install from the lockfile, full test suite and
# a full build of the desktop installers. The "CI" job aggregates everything into one check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build-linux:
    name: Build Linux (.deb, .AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:linux
      - name: Check the artifacts and the asar
        run: |
          ls -lh dist/*.deb dist/*.AppImage
          test -f dist/linux-unpacked/resources/app.asar

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist
      - name: Check the installer
        shell: bash
        run: ls -lh dist/RetreatManager-Setup-*.exe

  # Single check to require in branch protection: green only if every job above passed.
  ci:
    name: CI
    if: always()
    needs: [test, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "${{ join(needs.*.result, ' ') }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
