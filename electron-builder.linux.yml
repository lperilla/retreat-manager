extends: ./electron-builder.base.yml
files:
  - desktop/**/*
  - src/**/*
  - package.json
  - "!**/*.md"
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  # sharp: solo el binario de Linux glibc x64
  - "!node_modules/@img/sharp-win32*/**"
  - "!node_modules/@img/sharp-libvips-win32*/**"
  - "!node_modules/@img/sharp-darwin*/**"
  - "!node_modules/@img/sharp-libvips-darwin*/**"
  - "!node_modules/@img/sharp-linuxmusl*/**"
  - "!node_modules/@img/sharp-libvips-linuxmusl*/**"
  - "!node_modules/@img/sharp-wasm32/**"
linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Office
  maintainer: Retreat Manager <noreply@retreat-manager.local>
  synopsis: "Retreat Manager: cartas, participantes, habitaciones y mesas de un retiro"
  artifactName: RetreatManager-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: Retreat Manager
      StartupWMClass: Retreat Manager
  executableName: retreat-manager
deb:
  artifactName: retreat-manager_${version}_${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
